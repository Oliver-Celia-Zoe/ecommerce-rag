# ==========================================
# 前端 nginx 配置（生产反向代理）
# ==========================================
# 职责：
#   1. 托管前端静态文件（React 构建产物）
#   2. 反向代理 /api/* 到后端容器（避免浏览器跨域）
#   3. SPA 路由兜底：所有非文件请求都返回 index.html（React Router 用）

server {
    listen 80;
    server_name _;

    # 前端静态文件根目录
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩（减小传输体积）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    # ---------- 反向代理：API 请求转发到后端 ----------
    # 注意：proxy_pass 不带结尾的 /，会保留 /api 前缀
    # 例：浏览器请求 /api/v1/chat → 后端收到 /api/v1/chat
    location /api/ {
        proxy_pass http://backend:8000;  # backend 是 compose 里的服务名
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 接口可能慢（RAG 检索 + LLM 生成），延长超时
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # 支持 SSE 流式响应（未来扩展流式 LLM 用）
        proxy_buffering off;
    }

    # ---------- SPA 路由兜底 ----------
    # React Router 的前端路由（如 /chat、/login）都由 React 处理
    # 刷新页面时，nginx 找不到对应文件，要返回 index.html 让 React 接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的文件名可以长期缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
