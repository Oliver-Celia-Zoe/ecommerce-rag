[project]
name = "air-fryer-ai-backend"
version = "0.1.0"
description = "Air Fryer AI Assistant - 企业级 RAG 客服系统后端"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Developer", email = "dev@example.com"}
]

# ========== 核心依赖 ==========
dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # 数据库（异步）
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    # psycopg2-binary：alembic 迁移用同步驱动（env.py 把 +asyncpg 转为 postgresql://）
    "psycopg2-binary>=2.9.9",
    "alembic>=1.14.0",
    # 配置管理
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    # 向量库
    "qdrant-client>=1.12.0",
    # 缓存
    "redis>=5.2.0",
    # AI 框架
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.0",
    # HTTP 客户端
    "httpx>=0.27.0",
    # 结构化日志
    "structlog>=24.4.0",
    # 安全
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "email-validator>=2.2.0",
    # 工具
    "python-multipart>=0.0.17",
    "tenacity>=9.1.4",
    "slowapi>=0.1.10",
    "pyjwt>=2.13.0",
    "bcrypt==4.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "black>=24.10.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

# ========== UV 配置 ==========
[tool.uv]
default-groups = ["dev"]

# ========== Black 代码格式化 ==========
[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
    alembic/versions
)/
'''

# ========== Ruff 代码检查 ==========
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # 行长度由 black 控制

[tool.ruff.lint.pydocstyle]
convention = "google"

# ========== Pytest 测试配置 ==========
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]

# ========== Mypy 类型检查 ==========
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
